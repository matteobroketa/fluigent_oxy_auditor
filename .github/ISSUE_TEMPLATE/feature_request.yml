name: Feature request
description: Propose an analytical or interface improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the laboratory or analysis workflow that is currently difficult.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Describe what the application should do differently.
    validations:
      required: true
  - type: textarea
    id: analytical
    attributes:
      label: Analytical definition or acceptance criteria
      description: For metric/filtering changes, specify exactly which samples, phases, transitions, or calculations should be included.
  - type: dropdown
    id: priority
    attributes:
      label: Primary area
      options:
        - Analysis / metrics
        - Visualization / interaction
        - OXY/CSV compatibility
        - Export / reporting
        - Performance
        - Accessibility / usability
        - Other
